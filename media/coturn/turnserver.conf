# Optional standalone TURN server for Tandem Calls.
#
# LiveKit's built-in TURN (UDP 3478, enabled in compose.yaml) is enough for most networks, and
# ICE over TCP 7881 covers networks that block UDP. Run coturn only when participants sit
# behind firewalls that allow nothing but TLS on port 443: give it its own hostname/IP, a
# certificate, and tell LiveKit about it in livekit.yaml:
#
#   rtc:
#       turn_servers:
#           - host: turn.example.com
#             port: 443
#             protocol: tls
#             username: tandem
#             credential: <the password below>
#
#   docker compose --profile coturn up -d

listening-port=3478
tls-listening-port=443

# The public address of this host.
# external-ip=203.0.113.10

realm=turn.example.com
fingerprint
lt-cred-mech
user=tandem:change-this-password

cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# Relay only: never let TURN be used to reach private networks.
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255

min-port=49160
max-port=49200

no-cli
no-tlsv1
no-tlsv1_1
log-file=stdout
simple-log
